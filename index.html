<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wang Lab Student Book Keeping</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="app-header">
      <div>
        <h1>Wang Lab Student Book Keeping</h1>
        <p>TA / RA allotments and conference visits.</p>
      </div>
    </header>

    <nav class="section-switch" role="tablist" aria-label="Dashboard sections">
      <button class="section-button is-active" id="allotment-section-button" data-section="allotment" type="button" role="tab" aria-selected="true">TA/RA Allotment</button>
      <button class="section-button" id="conferences-section-button" data-section="conferences" type="button" role="tab" aria-selected="false">Conference Visits</button>
    </nav>

    <main class="dashboard">
      <section class="workspace" id="allotment-section">
        <div class="toolbar">
          <div class="view-switch" role="tablist" aria-label="TA/RA allotment views">
            <button class="view-button is-active" id="excel-view-button" data-view="excel" type="button" role="tab" aria-selected="true">Excel View</button>
            <button class="view-button" id="ratio-view-button" data-view="ratio" type="button" role="tab" aria-selected="false">Ratio View</button>
          </div>

          <div class="sort-controls" id="sort-controls" hidden>
            <label for="ratio-sort">Sort by</label>
            <select id="ratio-sort">
              <option value="ta-desc">Highest TA ratio</option>
              <option value="ta-asc">Lowest TA ratio</option>
              <option value="name-asc">Name A-Z</option>
            </select>
          </div>
        </div>

        <div class="legend" id="allotment-legend">
          <span class="legend-item"><span class="swatch swatch-ta"></span>TA</span>
          <span class="legend-item"><span class="swatch swatch-ra"></span>RA</span>
          <span class="legend-item"><span class="swatch swatch-before-joining"></span>Before joining lab</span>
          <span class="legend-item"><span class="swatch swatch-excluded"></span>Excluded from lab ratio</span>
        </div>

        <section class="panel main-panel">
          <div id="excel-view" class="view-panel"></div>
          <div id="ratio-view" class="view-panel" hidden></div>
        </section>
      </section>

      <aside class="sidebar" id="allotment-sidebar">
        <section class="panel summary-panel" id="ratio-summary-panel">
          <h2>TA / RA Ratio</h2>
          <div id="lab-ratio-summary"></div>
          <p class="summary-note">Whole-lab calculation ignores the orange cells only.</p>
        </section>

        <section class="panel form-panel" id="role-form-panel">
          <h2>Student Entry</h2>
          <form id="role-form">
            <label for="nickname">Nickname</label>
            <select id="nickname" name="nickname" required></select>
            <label for="semester">Semester</label>
            <select id="semester" name="semester" required></select>
            <label for="role">TA / RA</label>
            <select id="role" name="role" required>
              <option value="TA">TA</option>
              <option value="RA">RA</option>
            </select>
            <label for="rcsId">RCS ID</label>
            <input id="rcsId" name="rcsId" type="password" autocomplete="off" required placeholder="Enter your RCS ID">
            <button class="submit-button" type="submit">Save Entry</button>
          </form>
          <p id="form-message" class="form-message" aria-live="polite"></p>
        </section>
      </aside>

      <section class="conference-section" id="conference-section" hidden>
        <section class="panel main-panel">
          <div id="conference-view" class="view-panel"></div>
        </section>
        <aside class="sidebar">
          <section class="panel form-panel" id="conference-form-panel">
            <h2>Add Conference Visit</h2>
            <form id="conference-form">
              <label for="conference-nickname">Student</label>
              <select id="conference-nickname" name="nickname" required></select>
              <label for="conference-name">Conference name</label>
              <input id="conference-name" name="conferenceName" required maxlength="240">
              <label for="conference-dates">Visit dates</label>
              <input id="conference-dates" name="dates" required maxlength="100" placeholder="e.g. March 12-15, 2027">
              <label for="conference-location">Location</label>
              <input id="conference-location" name="location" required maxlength="160" placeholder="City, State, Country">
              <label for="conference-rcs-id">RCS ID</label>
              <input id="conference-rcs-id" name="rcsId" type="password" autocomplete="off" required>
              <button class="submit-button" type="submit">Save Visit</button>
            </form>
            <p id="conference-message" class="form-message" aria-live="polite"></p>
          </section>
        </aside>
      </section>
    </main>
  </div>

  <script>
    window.APP_CONFIG = {
      updateUrl: "https://silent-queen-b5fe.wasifbd2016.workers.dev/"
    };
  </script>
  <script src="app.js?v=student-bookkeeping-3"></script>
</body>
</html>
